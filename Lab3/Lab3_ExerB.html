<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Ticket Booking</title>
</head>
<body>

<!-- Error 1 (Line 1): <!DOCTYPE> should be <!DOCTYPE html> -->
<!-- Error 2 (Line 9): Incorrect closing order of </span> and </h1> -->
<!-- Error 3 (Line 11): <span id="content"> should be <div id="content"> -->
<!-- Error 4 (Line 13): < should be written as &lt; -->
<!-- Error 5 (Line 14): adult.value + child.value concatenates values as text -->
<!-- Error 6 (Line 18): type="emial" should be type="email" -->
<!-- Error 7 (Line 22): list="movies" does not match datalist id -->
<!-- Error 8 (Line 32): min and max values are reversed -->
<!-- Error 9 (Line 33): for="adult kid" should be for="adult child" -->
<!-- Error 10 (Line 38): &Copy; should be &copy; -->
<!-- Error 11 (Line 36): Closing tag should be </div> -->
<!-- Error 12 (Lines 54-55): Extra closing tags -->

<div id="header">
    <h1>e-Ticket <span>Your Campus Cinema</span></h1>
</div>

<div id="content">
    <h2>Book Your Ticket</h2>
    <p>Promotion: tickets &lt; RM10 for students &amp; staff!</p>

    <form action="booking.php" oninput="total.value = parseInt(adult.value) + parseInt(child.value)">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required autofocus><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email"><br>

        <label for="date">Show date:</label>
        <input type="date" id="date" name="date"><br>

        <label for="movie">Movie:</label>
        <input id="movie" name="movie" list="movielist"><br>

        <datalist id="movielist">
            <option value="Space Rangers">
            <option value="Kampung Comedy">
        </datalist>

        <label for="adult">Adult tickets:</label>
        <input type="number" id="adult" name="adult" value="0"><br>

        <label for="child">Child tickets:</label>
        <input type="number" id="child" name="child" value="0"><br>

        <label for="rating">Rate our service:</label>
        <input type="range" id="rating" name="rating" min="1" max="5"><br>

        Total tickets: <output name="total" for="adult child"></output><br>

        <input type="submit" value="Book Now">
    </form>
</div>

<div id="footer">
    <p>&copy; 2026 CineKampus. All rights reserved.</p>
</div>

</body>
</html>
